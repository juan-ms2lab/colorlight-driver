[project]
name = "ledpanels"
version = "0.1.0"
description = "Drive Colorlight 5A-75B LED panels over raw Ethernet"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow>=13.0.0",
    "segno>=1.6.6",
]

[project.scripts]
ledpanels = "ledpanels.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledpanels"]
